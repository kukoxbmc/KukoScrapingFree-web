{{PHEAD:novedades:hist_kicker:hist_title:hist_sub}}

<!-- ============================ HISTORIAL DE VERSIONES ============================ -->
<section class="wrap sec">
<div class="news">
<aside class="hist-side">
<div class="hist-stat">
<div><b id="hist-cur">—</b><span data-t="hist_current">{{T:hist_current}}</span></div>
<div><b id="hist-n">—</b><span data-t="hist_count">{{T:hist_count}}</span></div>
</div>
<div class="search" hidden data-search-box>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" id="hist-q" autocomplete="off" data-ph="hist_search" placeholder="{{T:hist_search}}" data-label="hist_search" aria-label="{{T:hist_search}}">
</div>
<div class="hist-btns" hidden data-search-box>
<button type="button" class="chip" id="hist-open" data-t="hist_open_all">{{T:hist_open_all}}</button>
<button type="button" class="chip" id="hist-close" data-t="hist_close_all">{{T:hist_close_all}}</button>
</div>
<a class="small" href="https://github.com/kukoxbmc/KukoScrapingFree-web/releases" data-t="news_all">{{T:news_all}}</a>
</aside>
<div>
<div id="hist-list" class="hist" aria-live="polite"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<p class="empty" id="hist-none" hidden data-t="hist_none">{{T:hist_none}}</p>
</div>
</div>
</section>

{{CTA}}
