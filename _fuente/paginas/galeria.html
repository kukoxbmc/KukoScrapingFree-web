{{PHEAD:galeria:shots_kicker:shots_title:shots_note}}

<!-- ============================ CAPTURAS EN PESTAÑAS ============================ -->
<section class="wrap sec" id="capturas">
<div class="tabs" data-tabs>
<div class="seg" role="tablist" data-label="shots_kicker" aria-label="Capturas" hidden>
<button type="button" role="tab" id="tab-ficha" aria-controls="p-ficha" aria-selected="true" data-t="gal_tab1">La ficha</button>
<button type="button" role="tab" id="tab-editor" aria-controls="p-editor" aria-selected="false" tabindex="-1" data-t="gal_tab2">El editor</button>
<button type="button" role="tab" id="tab-regiones" aria-controls="p-regiones" aria-selected="false" tabindex="-1" data-t="gal_tab3">Regiones</button>
<button type="button" role="tab" id="tab-mix" aria-controls="p-mix" aria-selected="false" tabindex="-1" data-t="gal_tab4">Composiciones</button>
</div>
<div class="panels">
<div class="panel" role="tabpanel" id="p-ficha" aria-labelledby="tab-ficha">
<div class="txt"><h2 data-t="s1_t">{{T:s1_t}}</h2><p data-t="s1_d">{{T:s1_d}}</p></div>
<button type="button" class="zoom" data-lb="imagenes/ficha.webp"><img width="1916" height="1076" loading="lazy" decoding="async" src="imagenes/ficha.webp" data-alt="alt_sheet" alt="{{T:alt_sheet}}"></button>
</div>
<div class="panel" role="tabpanel" id="p-editor" aria-labelledby="tab-editor">
<div class="txt"><h2 data-t="s2_t">{{T:s2_t}}</h2><p data-t="s2_d">{{T:s2_d}}</p></div>
<button type="button" class="zoom" data-lb="imagenes/editor.webp"><img width="1508" height="880" loading="lazy" decoding="async" src="imagenes/editor.webp" data-alt="alt_editor" alt="{{T:alt_editor}}"></button>
</div>
<div class="panel" role="tabpanel" id="p-regiones" aria-labelledby="tab-regiones">
<div class="txt"><h2 data-t="s3_t">{{T:s3_t}}</h2><p data-t="s3_d">{{T:s3_d}}</p></div>
<button type="button" class="zoom" data-lb="imagenes/regiones.webp" style="max-width:640px;justify-self:center"><img width="906" height="769" loading="lazy" decoding="async" src="imagenes/regiones.webp" data-alt="alt_regions" alt="{{T:alt_regions}}"></button>
</div>
<div class="panel full" role="tabpanel" id="p-mix" aria-labelledby="tab-mix">
<div class="txt"><h2 data-t="mix_title">{{T:mix_title}}</h2><p data-t="mix_sub">{{T:mix_sub}}</p>
<div class="mixes">
<button type="button" class="zoom" data-lb="imagenes/mix-crystal-sprint.webp"><img width="640" height="480" loading="lazy" src="imagenes/mix-crystal-sprint.webp" data-alt="alt_mix" data-alt-extra="Crystal Sprint" alt="{{T:alt_mix}}: Crystal Sprint"></button>
<button type="button" class="zoom" data-lb="imagenes/mix-dragon-valley.webp"><img width="640" height="480" loading="lazy" src="imagenes/mix-dragon-valley.webp" data-alt="alt_mix" data-alt-extra="Dragon Valley" alt="{{T:alt_mix}}: Dragon Valley"></button>
<button type="button" class="zoom" data-lb="imagenes/mix-neon-drift.webp"><img width="640" height="480" loading="lazy" src="imagenes/mix-neon-drift.webp" data-alt="alt_mix" data-alt-extra="Neon Drift" alt="{{T:alt_mix}}: Neon Drift"></button>
</div></div>
</div>
</div>
</div>
<p class="hint" data-t="shots_hint">{{T:shots_hint}}</p>
</section>

<!-- ============================ VÍDEO ============================ -->
<section class="band" id="video">
<div class="wrap sec vidsec">
<div>
<p class="kicker" data-t="gal_vid_k">{{T:gal_vid_k}}</p>
<h2 class="h2" data-t="gal_vid_t">{{T:gal_vid_t}}</h2>
<p class="lead" data-t="gal_vid_d">{{T:gal_vid_d}}</p>
</div>
<figure class="tv rv">
<div class="tv-body">
<div class="tv-screen">
<img src="imagenes/poster.webp" width="1280" height="720" loading="lazy" alt="">
<div class="tv-glare"></div>
<button type="button" class="tv-play big" data-video><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg><span data-t="hero_watch">{{T:hero_watch}}</span></button>
</div>
<div class="tv-foot"><span class="tv-label">KUKO&nbsp;·&nbsp;CH&nbsp;02</span><span class="tv-led" aria-hidden="true"></span></div>
</div>
</figure>
</div>
</section>

{{CTA}}
